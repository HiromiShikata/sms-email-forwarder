name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive build version
        id: version
        run: |
          BASE_VERSION_REGEX='\s+versionName System\.getenv\("BUILD_VERSION_NAME"\) \?: "([0-9]+)\.([0-9]+)\.[0-9]+"'
          BASE_MAJOR="$(grep -m 1 -E 'versionName.*\?: "' ./app/build.gradle | sed -E 's/.*\?: "([0-9]+)\..*/\1/')"
          BASE_MINOR="$(grep -m 1 -E 'versionName.*\?: "' ./app/build.gradle | sed -E 's/.*\?: "[0-9]+\.([0-9]+)\..*/\1/')"
          BUILD_VERSION_NAME="${BASE_MAJOR}.${BASE_MINOR}.${{ github.run_number }}"
          echo "BUILD_VERSION_NAME=$BUILD_VERSION_NAME" >> $GITHUB_ENV
          echo "build_version_name=$BUILD_VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build APKs
        shell: bash {0}
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }
          if ! ./gradlew assembleDebug -PbuildVersionCode="${{ github.run_number }}"; then
            exit_on_error "Build failed."
          fi

      - name: Attach universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-email-forwarder_universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Attach arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-email-forwarder_arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Publish APKs to GitHub Release on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          RELEASE_TAG="v${{ env.BUILD_VERSION_NAME }}"
          APK_DIR="app/build/outputs/apk/debug"
          STABLE_DIR="$APK_DIR/release-assets"
          mkdir -p "$STABLE_DIR"

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            SRC="$APK_DIR/app-${abi}-debug.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$STABLE_DIR/sms-email-forwarder_${abi}.apk"
            fi
          done

          RELEASE_NOTES="Automated build of main at ${GITHUB_SHA:0:7} (version ${{ env.BUILD_VERSION_NAME }}, build ${{ github.run_number }}). Install sms-email-forwarder_arm64-v8a.apk for most modern Android devices, or sms-email-forwarder_universal.apk for any ABI."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! gh release upload "$RELEASE_TAG" "$STABLE_DIR"/* --clobber; then
              exit_on_error "Failed to upload assets to existing release '$RELEASE_TAG'."
            fi
            gh release edit "$RELEASE_TAG" --title "${{ env.BUILD_VERSION_NAME }}" --notes "$RELEASE_NOTES" --latest || true
          else
            if ! gh release create "$RELEASE_TAG" "$STABLE_DIR"/* --target "$GITHUB_SHA" --title "${{ env.BUILD_VERSION_NAME }}" --notes "$RELEASE_NOTES" --latest; then
              exit_on_error "Failed to create release '$RELEASE_TAG'."
            fi
          fi
