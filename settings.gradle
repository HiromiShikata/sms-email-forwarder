pluginManagement {
    plugins {
        id 'org.jetbrains.kotlin.android' version '2.1.21'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "SmsEmailForwarder"
include ':app'
